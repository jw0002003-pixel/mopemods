<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mope Clone</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <style>
    :root {
      --bg-color: #1a2a3a;
      --menu-bg: rgba(20, 35, 55, 0.95);
      --text-color: #ffffff;
      --btn-color: #4CAF50;
      --btn-hover: #45a049;
      --input-bg: rgba(0, 0, 0, 0.5);
      --input-border: #ffffff;
    }

    body { margin: 0; background: var(--bg-color); font-family: sans-serif; }
    html, body { overflow-x: hidden; height: 100%; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 16px; text-shadow: 0 0 4px #000; pointer-events: none; z-index: 5; }
    #leaderboard { position: fixed; top: 10px; right: 10px; color: #fff; font-size: 16px; text-shadow: 0 0 4px #000; text-align: right; pointer-events: none; z-index: 5; }
    #minimap { position: fixed; bottom: 90px; right: 10px; border: 2px solid #fff; background: rgba(0,0,0,0.5); z-index: 5; }

    #menu {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 15px;
      box-sizing: border-box;
    }

    .menu-title {
      color: #ffffff;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 30px;
      text-shadow: 0 0 15px rgba(100, 200, 255, 0.8);
      letter-spacing: 2px;
    }

    .nickname-label {
      color: #ffffff;
      font-size: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    #name-input {
      padding: 16px 24px;
      font-size: 22px;
      border: 2px solid var(--input-border);
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--text-color);
      outline: none;
      text-align: center;
      width: 340px;
      max-width: 85vw;
      margin-bottom: 25px;
      font-weight: bold;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    #name-input:focus {
      border-color: #66ccff;
      box-shadow: 0 0 12px rgba(100, 200, 255, 0.6);
    }

    .play-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 30px;
    }

    #startBtn {
      padding: 18px 70px;
      font-size: 28px;
      background: var(--btn-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }
    #startBtn:hover {
      background: var(--btn-hover);
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
    }
    #startBtn:active { transform: scale(0.98); }

    #settingsBtn {
      width: 60px;
      height: 60px;
      font-size: 32px;
      background: #2196F3;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #settingsBtn:hover {
      background: #1976D2;
      transform: scale(1.08) rotate(90deg);
      box-shadow: 0 6px 20px rgba(33, 150, 243, 0.6);
    }

    #settings-panel {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #settings-panel.active { display: flex; }

    .settings-content {
      background: var(--menu-bg);
      padding: 30px 40px;
      border-radius: 20px;
      max-width: 420px;
      width: 90%;
      border: 2px solid #2196F3;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    .settings-title {
      color: #ffffff;
      font-size: 28px;
      text-align: center;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .settings-group { margin-bottom: 22px; }

    .settings-label {
      color: #ffffff;
      font-size: 16px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .theme-buttons { display: flex; gap: 10px; }
    .theme-buttons button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ffffff;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .theme-buttons button.active {
      background: #2196F3;
      border-color: #64b5f6;
      box-shadow: 0 0 15px rgba(33, 150, 243, 0.7);
    }
    .theme-buttons button:hover { background: rgba(33, 150, 243, 0.4); }

    .color-palette {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .color-swatch {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transform: scale(1.1);
    }

    .settings-actions { display: flex; gap: 12px; margin-top: 25px; }
    .settings-actions button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #ffffff;
      transition: all 0.2s;
    }
    #applySettings { background: #4CAF50; }
    #applySettings:hover { background: #45a049; }
    #resetSettings { background: #f44336; }
    #resetSettings:hover { background: #d32f2f; }

    #chat-input {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      width: 500px; max-width: 90vw;
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      outline: none;
      z-index: 60;
      text-align: center;
      box-sizing: border-box;
    }

    #bottom-bar {
      position: fixed; bottom: 0; left: 0;
      width: 100%; height: 92px;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      pointer-events: none;
      display: none;
    }
    #xp-bar {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 24px;
      background: rgba(0,0,0,0.7);
    }
    #xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #f4a100, #ffcc00, #ffe066);
      border-right: 2px solid #fff;
    }
    #water-bar {
      position: absolute; bottom: 46px; left: 0;
      width: 100%; height: 18px;
      background: rgba(0,0,0,0.7);
    }
    #water-fill {
      height: 100%;
      background: linear-gradient(90deg, #0077b6, #00b4d8, #90e0ef);
      border-right: 2px solid #fff;
    }
    #air-bar {
      position: absolute; bottom: 24px; left: 0;
      width: 100%; height: 18px;
      background: rgba(0,0,0,0.7);
    }
    #air-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0099ff, #66ccff, #99ddff);
      border-right: 2px solid #fff;
    }
    #bar-label {
      position: absolute; bottom: 66px; left: 0;
      width: 100%; height: 24px;
      text-align: center; line-height: 24px;
      color: #fff; font-size: 15px;
      text-shadow: 0 0 4px #000;
      font-weight: bold;
    }

    #joystick {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 160px;
      height: 160px;
      z-index: 100;
      display: none;
      touch-action: none;
      user-select: none;
    }
    #joystick-base {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 3px solid rgba(255,255,255,0.35);
      position: relative;
    }
    #joystick-stick {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      position: absolute;
      top: 45px;
      left: 45px;
    }
    #mobile-buttons {
      position: fixed;
      bottom: 30px;
      right: 20px;
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 15px;
    }
    #mobile-buttons button {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      font-size: 28px;
      color: #fff;
      border: 3px solid rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.4);
      touch-action: none;
      user-select: none;
      font-weight: bold;
    }
    #btn-ability { background: rgba(255, 150, 0, 0.55); }
    #btn-boost { background: rgba(255, 220, 0, 0.55); }
    #btn-drink { background: rgba(0, 150, 255, 0.55); }

    @media (max-width: 700px) {
      .menu-title { font-size: 28px; }
      #name-input { font-size: 18px; padding: 12px 18px; width: 80vw; }
      #startBtn { padding: 14px 50px; font-size: 22px; }
      #settingsBtn { width: 50px; height: 50px; font-size: 26px; }
      #hud { font-size: 12px; max-width: 60vw; }
      #leaderboard { font-size: 12px; }
      #minimap { width: 100px !important; height: 100px !important; bottom: 120px; right: 5px; }
      #bar-label { font-size: 12px; }
      #joystick { width: 130px; height: 130px; bottom: 15px; left: 15px; }
      #joystick-base { width: 130px; height: 130px; }
      #joystick-stick { width: 55px; height: 55px; top: 37px; left: 37px; }
      #mobile-buttons button { width: 60px; height: 60px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="leaderboard"></div>
  <canvas id="minimap" width="160" height="160"></canvas>

  <div id="bottom-bar">
    <div id="bar-label">0 XP (0 XP Next Animal)</div>
    <div id="water-bar"><div id="water-fill" style="width: 100%;"></div></div>
    <div id="air-bar"><div id="air-fill" style="width: 100%;"></div></div>
    <div id="xp-bar"><div id="xp-fill" style="width: 0%;"></div></div>
  </div>

  <input id="chat-input" type="text" maxlength="80" placeholder="Введи сообщение и нажми Enter..." style="display:none;" />

  <div id="menu">
    <div class="menu-title">🎮 MOPE CLONE</div>

    <div class="nickname-label">Введи ник</div>
    <input id="name-input" type="text" maxlength="16" placeholder="Nickname" />

    <div class="play-row">
      <button id="startBtn">▶ PLAY</button>
      <button id="settingsBtn" title="Настройки">⚙️</button>
    </div>
  </div>

  <div id="settings-panel">
    <div class="settings-content">
      <div class="settings-title">🎨 Настройки</div>

      <div class="settings-group">
        <div class="settings-label">🌙 Тема</div>
        <div class="theme-buttons">
          <button data-theme="dark" class="active">🌙 Тёмная</button>
          <button data-theme="light">☀️ Светлая</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-label">🎨 Цвет фона</div>
        <div class="color-palette" id="bg-palette">
          <div class="color-swatch active" data-color="#1a2a3a" style="background: #1a2a3a;"></div>
          <div class="color-swatch" data-color="#2d4a2d" style="background: #2d4a2d;"></div>
          <div class="color-swatch" data-color="#4a2d2d" style="background: #4a2d2d;"></div>
          <div class="color-swatch" data-color="#2d2d4a" style="background: #2d2d4a;"></div>
          <div class="color-swatch" data-color="#3a2a1a" style="background: #3a2a1a;"></div>
          <div class="color-swatch" data-color="#1a1a1a" style="background: #1a1a1a;"></div>
          <div class="color-swatch" data-color="#2a1a2a" style="background: #2a1a2a;"></div>
          <div class="color-swatch" data-color="#1a3a3a" style="background: #1a3a3a;"></div>
        </div>
      </div>

      <div class="settings-actions">
        <button id="applySettings">✓ Применить</button>
        <button id="resetSettings">↺ Сброс</button>
      </div>
    </div>
  </div>

  <div id="joystick">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>
  <div id="mobile-buttons">
    <button id="btn-ability">Q</button>
    <button id="btn-boost">⚡</button>
    <button id="btn-drink">💧</button>
  </div>

  <script src="skins.js"></script>
  <script src="client.js"></script>
</body>
</html>
