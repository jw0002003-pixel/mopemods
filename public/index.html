<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mope Clone</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 10px; left: 10px; color: #fff;
      font-size: 16px; text-shadow: 0 0 4px #000;
      pointer-events: none;
    }
    #leaderboard {
      position: fixed; top: 10px; right: 10px; color: #fff;
      font-size: 16px; text-shadow: 0 0 4px #000; text-align: right;
      pointer-events: none;
    }
    #minimap {
      position: fixed; bottom: 90px; right: 10px;
      border: 2px solid #fff; background: rgba(0,0,0,0.5);
    }
    #menu {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
    }
    #menu h1 { margin: 15px; font-size: 32px; }
    #name-input {
      padding: 25px 30px;
      font-size: 32px;
      border: 3px solid #fff;
      border-radius: 12px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      outline: none;
      text-align: center;
      width: 500px;
      margin-bottom: 40px;
      font-weight: bold;
    }
    .biome-buttons {
      display: flex; gap: 15px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 40px;
    }
    #menu button {
      padding: 18px 30px;
      font-size: 20px;
      border: 2px solid #fff;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    #menu button:hover { transform: scale(1.1); }
    #startBtn {
      padding: 30px 100px;
      font-size: 36px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }
    #startBtn:hover { background: #45a049; transform: scale(1.05); }
    #chat-input {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      width: 500px;
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      outline: none;
      z-index: 60;
      text-align: center;
    }
    #bottom-bar {
      position: fixed; bottom: 0; left: 0;
      width: 100%; height: 70px;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      pointer-events: none;
      display: none;
    }
    #xp-bar {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 24px;
      background: rgba(0,0,0,0.7);
    }
    #xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #f4a100, #ffcc00, #ffe066);
      transition: width 0.15s;
      border-right: 2px solid #fff;
    }
    #water-bar {
      position: absolute; bottom: 24px; left: 0;
      width: 100%; height: 18px;
      background: rgba(0,0,0,0.7);
    }
    #water-fill {
      height: 100%;
      background: linear-gradient(90deg, #0077b6, #00b4d8, #90e0ef);
      transition: width 0.15s;
      border-right: 2px solid #fff;
    }
    #bar-label {
      position: absolute; bottom: 44px; left: 0;
      width: 100%; height: 24px;
      text-align: center; line-height: 24px;
      color: #fff; font-size: 15px;
      text-shadow: 0 0 4px #000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="leaderboard"></div>
  <canvas id="minimap" width="160" height="160"></canvas>

  <div id="bottom-bar">
    <div id="bar-label">0 XP (0 XP Next Animal)</div>
    <div id="water-bar"><div id="water-fill" style="width: 100%;"></div></div>
    <div id="xp-bar"><div id="xp-fill" style="width: 0%;"></div></div>
  </div>

  <input id="chat-input" type="text" maxlength="80" placeholder="Введи сообщение и нажми Enter..." style="display:none;" />

  <div id="menu">
    <h1>🎮 Введи ник</h1>
    <input id="name-input" type="text" maxlength="16" placeholder="Твой ник" />
    <h1>🌍 Выбери биом</h1>
    <div class="biome-buttons">
      <button data-biome="forest" style="background:#2d5a27">🌲 Лес</button>
      <button data-biome="water" style="background:#1e3a5f">💧 Вода</button>
      <button data-biome="desert" style="background:#c2a56b">🏜️ Пустыня</button>
      <button data-biome="snow" style="background:#c8d8e8; color:#000">❄️ Снег</button>
    </div>
    <button id="startBtn">▶ ИГРАТЬ</button>
  </div>

  <script src="skins.js"></script>
  <script src="client.js"></script>
</body>
</html>
