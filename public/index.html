<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mope Clone</title>
  <style>
    body { margin: 0; background: #111; font-family: sans-serif; }
    html, body { overflow-x: hidden; height: 100%; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 16px; text-shadow: 0 0 4px #000; pointer-events: none; z-index: 5; }
    #leaderboard { position: fixed; top: 10px; right: 10px; color: #fff; font-size: 16px; text-shadow: 0 0 4px #000; text-align: right; pointer-events: none; z-index: 5; }
    #minimap { position: fixed; bottom: 90px; right: 10px; border: 2px solid #fff; background: rgba(0,0,0,0.5); z-index: 5; }

    #menu {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
      overflow-y: auto;
      padding: 15px;
      box-sizing: border-box;
    }
    #menu h1 { margin: 15px; font-size: 32px; text-align: center; }
    #name-input {
      padding: 20px 25px;
      font-size: 26px;
      border: 3px solid #fff;
      border-radius: 12px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      outline: none;
      text-align: center;
      width: 500px;
      max-width: 90vw;
      margin-bottom: 30px;
      font-weight: bold;
      box-sizing: border-box;
    }
    .biome-buttons {
      display: flex; gap: 15px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 30px;
      max-width: 90vw;
    }
    #menu button {
      padding: 18px 30px;
      font-size: 20px;
      border: 2px solid #fff;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    #menu button:hover { transform: scale(1.1); }
    #startBtn {
      padding: 25px 80px;
      font-size: 32px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 30px;
      font-weight: bold;
    }
    #startBtn:hover { background: #45a049; transform: scale(1.05); }

    #chat-input {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      width: 500px; max-width: 90vw;
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      outline: none;
      z-index: 60;
      text-align: center;
      box-sizing: border-box;
    }
    #bottom-bar {
      position: fixed; bottom: 0; left: 0;
      width: 100%; height: 92px;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      pointer-events: none;
      display: none;
    }
    #xp-bar {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 24px;
      background: rgba(0,0,0,0.7);
    }
    #xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #f4a100, #ffcc00, #ffe066);
      border-right: 2px solid #fff;
    }
    #water-bar {
      position: absolute; bottom: 46px; left: 0;
      width: 100%; height: 18px;
      background: rgba(0,0,0,0.7);
    }
    #water-fill {
      height: 100%;
      background: linear-gradient(90deg, #0077b6, #00b4d8, #90e0ef);
      border-right: 2px solid #fff;
    }
    #air-bar {
      position: absolute; bottom: 24px; left: 0;
      width: 100%; height: 18px;
      background: rgba(0,0,0,0.7);
    }
    #air-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0099ff, #66ccff, #99ddff);
      border-right: 2px solid #fff;
    }
    #bar-label {
      position: absolute; bottom: 66px; left: 0;
      width: 100%; height: 24px;
      text-align: center; line-height: 24px;
      color: #fff; font-size: 15px;
      text-shadow: 0 0 4px #000;
      font-weight: bold;
    }

    /* === МОБИЛЬНОЕ УПРАВЛЕНИЕ === */
    #joystick {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 160px;
      height: 160px;
      z-index: 100;
      display: none;
      touch-action: none;
      user-select: none;
    }
    #joystick-base {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 3px solid rgba(255,255,255,0.35);
      position: relative;
    }
    #joystick-stick {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      position: absolute;
      top: 45px;
      left: 45px;
    }
    #mobile-buttons {
      position: fixed;
      bottom: 30px;
      right: 20px;
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 15px;
    }
    #mobile-buttons button {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      font-size: 28px;
      color: #fff;
      border: 3px solid rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.4);
      touch-action: none;
      user-select: none;
      font-weight: bold;
    }
    #btn-ability { background: rgba(255, 150, 0, 0.55); }
    #btn-boost { background: rgba(255, 220, 0, 0.55); }
    #btn-drink { background: rgba(0, 150, 255, 0.55); }

    /* === АДАПТИВ ДЛЯ ТЕЛЕФОНА === */
    @media (max-width: 700px) {
      #menu { justify-content: flex-start; padding-top: 20px; }
      #menu h1 { font-size: 20px; margin: 8px; }
      #name-input {
        font-size: 22px;
        padding: 14px 18px;
        width: 90vw;
        max-width: 320px;
        margin-bottom: 15px;
      }
      .biome-buttons { gap: 8px; margin-bottom: 15px; }
      #menu button[data-biome] { padding: 12px 16px; font-size: 14px; }
      #startBtn {
        padding: 18px 60px;
        font-size: 24px;
        margin-top: 10px;
        margin-bottom: 30px;
      }
      #hud { font-size: 12px; max-width: 60vw; }
      #leaderboard { font-size: 12px; }
      #minimap { width: 100px !important; height: 100px !important; bottom: 120px; right: 5px; }
      #bar-label { font-size: 12px; }
      #joystick { width: 130px; height: 130px; bottom: 15px; left: 15px; }
      #joystick-base { width: 130px; height: 130px; }
      #joystick-stick { width: 55px; height: 55px; top: 37px; left: 37px; }
      #mobile-buttons button { width: 60px; height: 60px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="leaderboard"></div>
  <canvas id="minimap" width="160" height="160"></canvas>

  <div id="bottom-bar">
    <div id="bar-label">0 XP (0 XP Next Animal)</div>
    <div id="water-bar"><div id="water-fill" style="width: 100%;"></div></div>
    <div id="air-bar"><div id="air-fill" style="width: 100%;"></div></div>
    <div id="xp-bar"><div id="xp-fill" style="width: 0%;"></div></div>
  </div>

  <input id="chat-input" type="text" maxlength="80" placeholder="Введи сообщение и нажми Enter..." style="display:none;" />

  <div id="menu">
    <h1>🎮 Введи ник</h1>
    <input id="name-input" type="text" maxlength="16" placeholder="Твой ник" />
    <h1>🌍 Выбери биом</h1>
    <div class="biome-buttons">
      <button data-biome="forest" style="background:#2d5a27">🌲 Лес</button>
      <button data-biome="water" style="background:#1e3a5f">💧 Вода</button>
      <button data-biome="desert" style="background:#c2a56b">🏜️ Пустыня</button>
      <button data-biome="snow" style="background:#c8d8e8; color:#000">❄️ Снег</button>
    </div>
    <button id="startBtn">▶ ИГРАТЬ</button>
  </div>

  <!-- === МОБИЛЬНОЕ УПРАВЛЕНИЕ === -->
  <div id="joystick">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>
  <div id="mobile-buttons">
    <button id="btn-ability">Q</button>
    <button id="btn-boost">⚡</button>
    <button id="btn-drink">💧</button>
  </div>

  <script src="skins.js"></script>
  <script src="client.js"></script>
</body>
</html>
